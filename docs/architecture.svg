<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sixty Days as-built architecture</title>
  <desc id="desc">A browser calls the Sixty Days Cloud Run service. Bounded workflow roles use a durable spine, Firestore, Cloud Scheduler, Cloud Trace, Gemini, and Gemma. Gemini Image and Veo generate recorded, static onboarding media outside the case path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafbf9"/><stop offset="1" stop-color="#e9f5f4"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102033" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00666d"/></marker>
    <style>
      .title{font:700 46px system-ui,sans-serif;fill:#102033}.sub{font:400 21px system-ui,sans-serif;fill:#526174}
      .label{font:700 15px system-ui,sans-serif;letter-spacing:1.5px;fill:#00666d}.h{font:700 24px system-ui,sans-serif;fill:#102033}
      .body{font:400 18px system-ui,sans-serif;fill:#526174}.small{font:400 15px system-ui,sans-serif;fill:#526174}
      .box{fill:#fff;stroke:#cbd7e5;stroke-width:2;rx:18;filter:url(#shadow)}.accent{fill:#e3f3f3;stroke:#00666d}
      .safe{fill:#e8f5ee;stroke:#4a8f70}.media{fill:#fff4d6;stroke:#a77912}.line{fill:none;stroke:#00666d;stroke-width:4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#a77912;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="88" class="title">Sixty Days</text>
  <text x="90" y="126" class="sub">As-built architecture · applicant-controlled workflow on Google Cloud</text>
  <rect x="80" y="205" width="260" height="190" class="box"/>
  <text x="110" y="242" class="label">PUBLIC SURFACE</text><text x="110" y="282" class="h">Browser</text>
  <text x="110" y="318" class="body">Guided workflow</text><text x="110" y="346" class="body">Draft packet</text><text x="110" y="374" class="body">Judge evidence</text>
  <rect x="425" y="170" width="520" height="410" class="box accent"/>
  <text x="460" y="208" class="label">CLOUD RUN · SIXTY-DAYS</text><text x="460" y="250" class="h">Bounded workflow roles</text>
  <rect x="460" y="280" width="210" height="92" class="box"/><text x="480" y="314" class="body">Read · Route</text><text x="480" y="344" class="body">Plan · Schedule</text>
  <rect x="700" y="280" width="210" height="92" class="box"/><text x="720" y="314" class="body">Screen · Prepare</text><text x="720" y="344" class="body">Assemble · Verify</text>
  <rect x="460" y="398" width="450" height="140" class="box safe"/>
  <text x="485" y="433" class="label">DURABLE SPINE</text><text x="485" y="470" class="body">Typed state · leases · eight-wake ladder</text>
  <text x="485" y="500" class="body">redaction · quarantine · partial-safe render</text>
  <rect x="1030" y="170" width="480" height="238" class="box"/>
  <text x="1060" y="208" class="label">GOOGLE CLOUD · US-CENTRAL1</text><text x="1060" y="250" class="h">Durable services</text>
  <text x="1060" y="292" class="body">Firestore · cases, requirements, wakes</text><text x="1060" y="326" class="body">Cloud Scheduler · due-wake worker</text>
  <text x="1060" y="360" class="body">Cloud Trace and Logging · observable proof</text>
  <rect x="1030" y="458" width="480" height="180" class="box safe"/>
  <text x="1060" y="496" class="label">VERTEX AI · GLOBAL ENDPOINT</text><text x="1060" y="536" class="h">Case-path models</text>
  <text x="1060" y="575" class="body">Gemini 3.5 Flash · letters and evidence</text><text x="1060" y="607" class="body">Gemma 4 MaaS · spans-only name review</text>
  <rect x="425" y="680" width="1085" height="130" class="box media"/>
  <text x="460" y="718" class="label">RECORDED BUILD-TIME MEDIA · OUTSIDE CASE PATH</text>
  <text x="460" y="757" class="h">Gemini 3.1 Flash Image + Veo 3.1 Fast</text>
  <text x="460" y="790" class="body">Non-data-bearing onboarding assets · never accepted as evidence or placed in a packet</text>
  <path d="M340 300 H425" class="line"/><path d="M945 300 H1030" class="line"/><path d="M945 515 H1030" class="line"/>
  <path d="M965 680 V635 H340 V365" class="dash"/>
  <text x="90" y="850" class="small">The system prepares, tracks, and verifies; the applicant reviews, sends, and submits.</text>
</svg>
